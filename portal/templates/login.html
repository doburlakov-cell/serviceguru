{% extends "base.html" %}{% block title %}Вход — ServiceGuru{% endblock %}
{% block body %}
<div class="card narrow">
  <span class="logo">ServiceGuru</span>
  <h1 style="margin-top:16px">Вход</h1>
  <p class="sub">Один логин и пароль для всех проектов</p>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
    <label>Логин</label><input type="text" name="login" autocomplete="username" autofocus required>
    <label>Пароль</label><input type="password" name="password" autocomplete="current-password" required>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <button style="width:100%">Войти</button>
  </form>
</div>
{% endblock %}
